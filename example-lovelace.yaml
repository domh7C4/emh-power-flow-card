# EMH Power Flow Card v1.0.1 – entitätsfreie Basisvorlage
# Die Screenshots in README.md zeigen die echte Card mit simulierten Demowerten.
# Ohne eigene Home-Assistant-Sensoren werden keine Live-Leistungen angezeigt.
# Nach dem Hinzufügen Entitäten im grafischen Editor zuweisen.

type: custom:emh-power-flow-card
theme: auto
min_flow_w: 0

appearance:
  transparent_background: true
  ring_width_percent: 50

animation:
  style: dots
  speed: 1
  glow: 65
  max_drops: 3
  mobile_power_save: true
  mobile_fps: 25
  mobile_max_particles: 2

nodes:
  grid:
    ring_max: 5000
    alert_threshold_w: 5000
    alert_from_percent: 90
    alert_color: "#f04b54"
  battery:
    ring_source: soc
    use_soc_colors: true

display:
  footer: true
  energy_split: true
  fossil: true
  live: true
  info_button: true

# Nur Kachelnamen und Icons, keine Sensoren:
individual:
  - id: individual_1
    name: Individual 1
    icon: mdi:washing-machine
    secondary_mode: text
    secondary_text: Waschgang
  - id: individual_2
    name: Individual 2
    icon: mdi:car-electric
    secondary_mode: text
    secondary_text: Lädt
  - id: individual_3
    name: Individual 3
    icon: mdi:thermometer
    secondary_mode: text
    secondary_text: Heizung
  - id: individual_4
    name: Individual 4
    icon: mdi:snowflake
    secondary_mode: text
    secondary_text: Kühlung
  - id: individual_5
    name: Individual 5
    icon: mdi:monitor
    secondary_mode: text
    secondary_text: Standby
  - id: individual_6
    name: Individual 6
    icon: mdi:calendar
    secondary_mode: text
    secondary_text: Energie
